<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030504">
<meta name="description" content="PRIVATE STATE — private retreat and digital silence outside Moscow.">
<title>PRIVATE STATE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23030504'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-family='monospace' font-size='24' font-weight='700' fill='%2342c86d'%3EP%C2%B7S%3C/text%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap');
:root{--bg:#030504;--soft:#070908;--surface:#0c100e;--fg:#e6ece7;--muted:#8a948c;--dim:#5c665e;--green:#42c86d;--border:#1a221c;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--bg)}body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}a{color:inherit}button{font:inherit;color:inherit}.mono{font-family:"Space Mono",monospace}.green{color:var(--green)}.muted{color:var(--muted)}.dim{color:var(--dim)}.container{width:min(1150px,100%);margin:auto}section{padding:120px 5vw}h1,h2,h3,p{margin:0}h2{font-size:clamp(42px,7vw,88px);line-height:.94;letter-spacing:-.055em;font-weight:500}.eyebrow{font:10px "Space Mono",monospace;letter-spacing:.18em;color:var(--green);margin-bottom:22px}.eyebrow:before{content:"// ";opacity:.45}
.header{position:fixed;z-index:1000;top:0;left:0;right:0;height:72px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;background:rgba(3,5,4,.72);backdrop-filter:blur(14px)}.logo{font:700 13px "Space Mono";letter-spacing:.16em;text-decoration:none;display:flex;gap:7px;align-items:center}.dot{width:6px;height:6px;background:var(--green);border-radius:50%}.nav{display:flex;align-items:center;gap:12px}.lang button{border:0;background:none;color:var(--dim);cursor:pointer;padding:5px;font:10px "Space Mono"}.lang button.active,.lang button:hover{color:var(--green)}.icon{width:36px;height:36px;border:1px solid var(--border);border-radius:50%;display:grid;place-items:center;text-decoration:none;color:var(--green)}.icon svg{width:14px;height:14px;fill:currentColor}
.hero{min-height:100svh;padding:0 5vw;display:flex;align-items:center;position:relative;overflow:hidden}.hero-media,.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,5,4,.7),rgba(3,5,4,.25)),linear-gradient(0deg,var(--bg),transparent 65%)}.hero-content{position:relative;z-index:2;width:min(1250px,100%);margin:auto;padding-top:40px}.hero h1{font-size:clamp(70px,13vw,180px);line-height:.78;letter-spacing:-.085em;font-weight:500}.hero h1 span{display:block;color:var(--green)}.type{max-width:720px;margin-top:38px;min-height:52px;font:clamp(12px,1.3vw,16px)/1.65 "Space Mono";color:var(--muted)}.hero-bottom{position:absolute;left:5vw;right:5vw;bottom:30px;z-index:2;display:flex;justify-content:space-between;font:9px "Space Mono";letter-spacing:.12em;color:var(--dim)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9vw;align-items:end}.quote{font-size:clamp(38px,5vw,70px);line-height:1;letter-spacing:-.055em}.quote span{display:block;color:var(--muted);margin-top:10px}.intro p{font-size:15px;line-height:1.8;color:var(--muted);max-width:600px}.intro p+p{margin-top:16px}
.gallery{position:relative;border:1px solid var(--border);overflow:hidden}.gallery img{display:block;width:100%;aspect-ratio:16/8.5;object-fit:cover}.gallery-bar{position:absolute;left:0;right:0;bottom:0;padding:45px 16px 16px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(transparent,rgba(3,5,4,.95));font:10px "Space Mono"}.gallery-btns,.pager{display:flex;gap:7px}.gallery-btns button{min-width:40px;height:40px;border:1px solid var(--border);background:rgba(3,5,4,.5);cursor:pointer}.pager button{width:17px;height:5px;padding:0;border:0;background:var(--dim);cursor:pointer}.pager button.active{background:var(--green)}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:45px}.card{position:relative;overflow:hidden;border:1px solid var(--border);min-height:390px}.card.epic{grid-column:1/-1;min-height:330px}.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.38}.card .inner{position:relative;padding:28px;background:linear-gradient(90deg,rgba(3,5,4,.86),rgba(3,5,4,.48));height:100%}.code{font:10px "Space Mono";letter-spacing:.13em;color:var(--green)}.card h3{font-size:clamp(36px,5vw,58px);font-weight:500;letter-spacing:-.06em;margin-top:55px}.price{font:13px "Space Mono";color:var(--green);margin-top:8px}.desc{max-width:650px;color:var(--muted);line-height:1.65;font-size:14px;margin-top:20px}.features{list-style:none;padding:0;margin:22px 0 0}.features li{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--muted)}.features li:before{content:"↗ ";color:var(--green)}.cta-link{display:inline-block;margin-top:24px;font:10px "Space Mono";letter-spacing:.14em;text-decoration:none}.cta-link:hover{color:var(--green)}
.opt{margin-top:18px;border:1px solid var(--border);background:var(--surface);padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;cursor:pointer;user-select:none}.opt.on{border-color:var(--green)}.opt-copy p{font-size:13px;line-height:1.65;color:var(--muted);max-width:640px}.switch{flex:0 0 56px;width:56px;height:30px;border-radius:20px;border:1px solid var(--dim);background:#070908;position:relative}.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:.25s}.opt.on .switch{border-color:var(--green)}.opt.on .switch i{left:29px;background:var(--green)}
.fullmedia{min-height:100svh;position:relative;display:flex;align-items:flex-end;overflow:hidden}.fullmedia .content{position:relative;z-index:2;padding-bottom:10vh}.fullmedia .shade{background:linear-gradient(0deg,var(--bg),rgba(3,5,4,.2) 75%)}.lead{max-width:650px;color:var(--muted);line-height:1.75;font-size:15px;margin-top:24px}
.protocol{display:grid;grid-template-columns:1.4fr .6fr;gap:14px;margin-top:42px}.film{position:relative;border:1px solid var(--border);min-height:430px;overflow:hidden}.film img{width:100%;height:100%;min-height:430px;object-fit:cover}.film-info{position:absolute;left:0;right:0;bottom:0;padding:70px 20px 20px;background:linear-gradient(transparent,var(--bg))}.steps{display:flex;flex-direction:column;gap:6px}.steps button{min-height:56px;text-align:left;border:1px solid var(--border);background:none;padding:0 15px;cursor:pointer;font:10px "Space Mono";display:flex;justify-content:space-between}.steps button.active{border-color:var(--green);color:var(--green)}
.phone{display:grid;grid-template-columns:1fr 1fr;gap:9vw;align-items:center}.phone-stage{position:relative;border:1px solid var(--border);overflow:hidden;display:grid;grid-template-columns:1fr 1fr;background:var(--bg)}.phone-stage video,.phone-stage img{width:100%;min-height:430px;object-fit:cover}.toggle{position:absolute;right:calc(50% + 15px);bottom:15px;width:95px;height:150px;border:2px solid var(--dim);border-radius:26px;background:rgba(3,5,4,.9);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}.toggle.off{border-color:var(--green)}
.portrait{max-width:650px;margin:40px auto 0;border:1px solid var(--border);position:relative;overflow:hidden}.portrait img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover;object-position:top}.portrait .label{position:absolute;bottom:0;left:0;right:0;padding:70px 20px 20px;background:linear-gradient(transparent,var(--bg))}.service-grid,.trust-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:42px}.service,.trust{border:1px solid var(--border);background:var(--surface);overflow:hidden}.service img{width:100%;height:150px;object-fit:cover}.service div,.trust{padding:20px}.service p:last-child,.trust p:last-child{font-size:12px;line-height:1.7;color:var(--muted);margin-top:10px}.trust-grid{grid-template-columns:repeat(3,1fr)}
.faq-list{margin-top:40px;border-top:1px solid var(--border)}details{border-bottom:1px solid var(--border)}summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;padding:20px 0;font-size:14px}details p{padding:0 30px 20px 0;color:var(--muted);font-size:13px;line-height:1.7}
.final{min-height:100svh;position:relative;display:grid;place-items:center;text-align:center;overflow:hidden}.final .content{position:relative;z-index:2;padding:100px 20px}.final h2{font-size:clamp(68px,12vw,160px)}.final h2 span{display:block;color:var(--green)}.buttons{display:flex;flex-direction:column;gap:12px;width:min(400px,100%);margin:36px auto 0}.buttons a{min-height:54px;display:grid;place-items:center;border:1px solid var(--green);text-decoration:none;font:11px "Space Mono";letter-spacing:.14em}.buttons a:first-child{background:var(--green);color:var(--bg)}footer{padding:25px 5vw 45px;display:flex;justify-content:space-between;font:9px "Space Mono";color:var(--dim)}.mobile-cta{display:none}
.boot{position:fixed;inset:0;background:var(--bg);z-index:5000;display:grid;place-items:center}.boot.hide{opacity:0;visibility:hidden;pointer-events:none}.boot-in{width:min(420px,82vw)}.boot-status{font:10px "Space Mono";letter-spacing:.2em;color:var(--green)}.boot-logo{font-size:38px;font-weight:500;margin:28px 0}.boot-list{font:10px/2 "Space Mono";color:var(--muted)}.progress{height:1px;background:var(--border);margin-top:30px}.progress i{display:block;width:100%;height:100%;background:var(--green)}
@media(max-width:800px){section{padding:80px 5vw 48px}.grid2,.phone,.protocol{grid-template-columns:1fr;gap:28px}.cards{grid-template-columns:1fr}.service-grid{grid-template-columns:1fr 1fr}.trust-grid{grid-template-columns:1fr}.hero h1{font-size:clamp(56px,16vw,96px)}.phone-stage{grid-template-columns:1fr}.phone-stage video{display:none}.phone-stage img{min-height:260px}.header{height:60px}}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="boot-in"><div class="boot-status" id="bootStatus"></div><div class="boot-logo">PRIVATE <span class="green">STATE</span></div><div class="mono dim" style="font-size:10px" id="bootWait"></div><div class="boot-list"><div>01 <span id="b1"></span></div><div>02 <span id="b2"></span></div><div>03 <span id="b3"></span></div></div><div class="progress"><i></i></div></div></div>
<header class="header"><a class="logo" href="#top"><span>P</span><i class="dot"></i><span>S</span><span class="dim" style="margin-left:6px">PRIVATE STATE</span></a><nav class="nav"><div class="lang"><button data-lang="ru" class="active">RU</button><button data-lang="en">EN</button><button data-lang="zh">ZH</button></div><a class="icon" id="tgHead" target="_blank" aria-label="Telegram"><svg viewBox="0 0 24 24"><path d="M21.5 3.4 18.2 20c-.2 1-.8 1.2-1.6.8l-4.4-3.3-2.1 2c-.2.3-.5.5-1 .5l.3-4.5 8.2-7.4c.4-.3 0-.5-.5-.2l-10 6.3-4.3-1.3c-.9-.3-.9-.9.2-1.3L20.2 2.6c.8-.3 1.5.2 1.3.8Z"/></svg></a><a class="icon" id="igHead" target="_blank" aria-label="Instagram"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.4" cy="6.7" r="1.2" fill="currentColor"/></svg></a></nav></header>
<main id="top">
<section class="hero"><video id="heroVideo" class="hero-media" autoplay muted playsinline poster=""><source id="heroSource"></video><div class="shade"></div><div class="hero-content"><div class="hero-kicker" style="display:flex;gap:12px;font:10px 'Space Mono';letter-spacing:.16em;color:var(--muted);margin-bottom:28px"><span class="dot"></span><span data-t="kicker"></span></div><h1><span data-t="hero1"></span><span data-t="hero2"></span></h1><p class="type" id="type"></p></div><div class="hero-bottom"><span>MOSCOW REGION</span><span data-t="scroll"></span></div></section>
<section class="intro"><div class="container grid2"><div><div class="eyebrow" data-t="concept"></div><div class="quote"><span data-t="quote1"></span><span data-t="quote2"></span></div></div><div><p data-t="intro1"></p><p data-t="intro2"></p></div></div></section>
<section><div class="container"><div class="eyebrow" data-t="swipe"></div><div class="gallery" id="gallery"><img id="galleryImg"><div class="gallery-bar"><span id="galleryCap"></span><div class="pager" id="pager"></div><div class="gallery-btns"><button id="prev">‹</button><button id="next">›</button></div></div></div></div></section>
<section id="formats"><div class="container"><div class="eyebrow" data-t="choose"></div><h2 data-t="three"></h2><p class="mono dim" style="font-size:10px;margin-top:14px" data-t="note"></p><div class="cards" id="cards"></div>
<div class="opt" id="trainerOpt" role="switch" aria-checked="false" tabindex="0">
<div class="opt-copy"><div class="code" data-t="coachCode"></div><p data-t="coachDesc"></p><div class="price" data-t="coachPrice"></div></div>
<div class="switch" aria-hidden="true"><i></i></div>
</div></div></section>
<section class="fullmedia"><video class="cover" id="spaVideo" autoplay muted loop playsinline></video><img class="cover" id="spaPoster"><div class="shade"></div><div class="container content"><div class="eyebrow" data-t="cinema"></div><h2 data-t="cinemaTitle"></h2><p class="lead" data-t="cinemaLead"></p></div></section>
<section id="protocol"><div class="container"><div class="eyebrow" data-t="protocol"></div><h2 data-t="protocolTitle"></h2><p class="lead" data-t="protocolLead"></p><div class="protocol"><div class="film"><img id="filmImg"><div class="film-info"><div class="mono green" style="font-size:10px" id="filmTitle"></div><p class="muted" style="font-size:13px;margin-top:8px" id="filmText"></p></div></div><div class="steps" id="steps"></div></div></div></section>
<section><div class="container phone"><div class="phone-stage"><video id="phoneVideo" autoplay muted loop playsinline></video><img id="phonePoster"><button class="toggle" id="toggle"><span class="green mono" id="toggleText">NO SIGNAL</span><span class="dim mono" style="font-size:9px;margin-top:10px">TAP</span></button></div><div><div class="eyebrow" data-t="phone"></div><h2 style="font-size:clamp(40px,5vw,65px)" data-t="phoneTitle"></h2><p class="lead" data-t="phoneLead"></p><div id="phoneSteps" style="margin-top:30px"></div></div></div></section>
<section id="concierge"><div class="container"><div class="eyebrow" data-t="concierge"></div><h2 style="max-width:850px;font-size:clamp(40px,5.5vw,72px)" data-t="conciergeTitle"></h2><p class="lead" data-t="conciergeText"></p><div class="portrait"><img id="conciergeImg"><div class="label"><div class="mono green" style="font-size:10px">● <span data-t="concierge"></span></div><strong style="display:block;margin-top:7px;font-size:26px">ANNA</strong></div></div><div class="grid2" style="margin-top:15px"><div style="border:1px solid var(--border);overflow:hidden"><img id="securityImg" style="width:100%;height:190px;object-fit:cover"><p class="mono green" style="font-size:10px;padding:10px" data-t="guard"></p></div><div style="border:1px solid var(--border);padding:22px"><div class="eyebrow" data-t="important"></div><p class="muted" style="font-size:13px;line-height:1.7" data-t="importantText"></p></div></div></div></section>
<section><div class="container"><div class="eyebrow" data-t="built"></div><h2 style="font-size:clamp(40px,6vw,76px)" data-t="servicesTitle"></h2><p class="lead" data-t="servicesLead"></p><div class="service-grid" id="services"></div></div></section>
<section class="fullmedia"><video class="cover" id="moscowVideo" autoplay muted loop playsinline></video><img class="cover" id="moscowPoster"><div class="shade"></div><div class="container content"><div class="eyebrow" data-t="arrival"></div><h2 style="max-width:850px" data-t="arrivalTitle"></h2><p class="lead" data-t="arrivalText"></p><div class="mono green" style="font-size:10px;margin-top:28px">MOSCOW REGION<br><span class="dim" data-t="arrivalPin"></span></div></div></section>
<section><div class="container"><div class="eyebrow" data-t="trust"></div><div class="trust-grid" id="trust"></div></div></section>
<section id="faq"><div class="container"><div class="eyebrow" data-t="faq"></div><h2 data-t="faqTitle"></h2><p class="lead" data-t="faqLead"></p><div class="faq-list" id="faqList"></div></div></section>
<section class="final"><img class="cover" id="finalImg"><div class="shade"></div><div class="final content"><div class="eyebrow" data-t="final"></div><h2><span style="color:var(--fg)" data-t="ready"></span><span data-t="disappear"></span></h2><p class="lead" style="margin-left:auto;margin-right:auto" data-t="finalText"></p><div class="buttons"><a id="tgFinal" target="_blank" data-t="tg"></a><a id="igFinal" target="_blank" data-t="igWrite"></a></div><p class="mono dim" style="font-size:9px;margin-top:15px" data-t="direct"></p></div></section>
</main><footer><span>PRIVATE STATE</span><span data-t="wait"></span><a id="igFooter" target="_blank" data-t="ig"></a></footer><div class="mobile-cta"><a id="tgMobile" target="_blank">TELEGRAM</a><a id="igMobile" target="_blank">INSTAGRAM</a></div>
<script src="app.js"></script>
